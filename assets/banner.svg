<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" role="img" aria-label="A road to the horizon under a wide sky; a signpost reads JEB ST and JEV BENCHMARKS; a yellow diamond warns DECISIONS AHEAD">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d33"/><stop offset=".45" stop-color="#2a5d9c"/><stop offset=".78" stop-color="#e7a35b"/><stop offset="1" stop-color="#f7d58a"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d5"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset="1" stop-color="#2b2b2b"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5a3a"/><stop offset="1" stop-color="#3b3222"/></linearGradient>
    <linearGradient id="pole" x1="0" x2="1"><stop offset="0" stop-color="#9a9a9a"/><stop offset=".5" stop-color="#d8d8d8"/><stop offset="1" stop-color="#7a7a7a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <!-- sky -->
  <rect width="1400" height="300" fill="url(#sky)"/>
  <circle cx="1040" cy="236" r="120" fill="url(#sun)" opacity=".9"/>
  <circle cx="1040" cy="236" r="46" fill="#fff3c4"/>
  <!-- clouds -->
  <g fill="#fff" opacity=".85">
    <ellipse cx="260" cy="90" rx="90" ry="22"/><ellipse cx="300" cy="78" rx="60" ry="26"/><ellipse cx="215" cy="84" rx="50" ry="20"/>
    <ellipse cx="760" cy="60" rx="70" ry="16"/><ellipse cx="790" cy="50" rx="44" ry="20"/>
    <ellipse cx="1230" cy="120" rx="80" ry="18"/><ellipse cx="1265" cy="110" rx="50" ry="22"/>
  </g>
  <!-- far hills and a skyline -->
  <path d="M0 270 Q120 220 240 262 T480 258 T720 266 T960 252 T1200 268 T1400 256 V300 H0 Z" fill="#1f3a5a" opacity=".9"/>
  <g fill="#132a45">
    <rect x="70" y="228" width="26" height="72"/><rect x="104" y="212" width="18" height="88"/><rect x="130" y="240" width="34" height="60"/><rect x="176" y="222" width="14" height="78"/>
    <rect x="1180" y="232" width="22" height="68"/><rect x="1210" y="218" width="30" height="82"/><rect x="1250" y="240" width="16" height="60"/><rect x="1276" y="226" width="26" height="74"/><rect x="1316" y="244" width="40" height="56"/>
  </g>
  <!-- ground -->
  <rect y="300" width="1400" height="180" fill="url(#ground)"/>
  <!-- road in perspective, converging to the vanishing point -->
  <path d="M700 300 L740 300 L1180 480 L220 480 Z" fill="url(#road)"/>
  <path d="M700 300 L720 300 L1180 480 L1150 480 Z" fill="#f4f4f2" opacity=".85" transform="translate(0 0)"/>
  <path d="M700 300 L720 300 L250 480 L220 480 Z" fill="#f4f4f2" opacity=".85"/>
  <!-- dashed centre line -->
  <g fill="#f5c518">
    <path d="M718 318 L722 318 L723 332 L717 332 Z"/><path d="M716 345 L724 345 L726 366 L714 366 Z"/><path d="M712 384 L728 384 L732 414 L708 414 Z"/><path d="M706 436 L734 436 L740 480 L700 480 Z"/>
  </g>
  <!-- a car far down the road -->
  <g transform="translate(690 340)"><rect x="0" y="0" width="22" height="10" rx="3" fill="#e5484d"/><rect x="5" y="-6" width="12" height="7" rx="2" fill="#f4f4f2"/><circle cx="4" cy="10" r="2.5" fill="#111"/><circle cx="18" cy="10" r="2.5" fill="#111"/></g>
  <!-- curb -->
  <path d="M220 480 L700 302 L680 302 L180 480 Z" fill="#8c8c8c"/>
  <!-- signpost -->
  <g filter="url(#shadow)">
    <rect x="1024" y="150" width="14" height="330" fill="url(#pole)"/>
    <!-- JEB ST street sign (green) -->
    <g transform="translate(1031 162) rotate(-4)">
      <rect x="-20" y="0" width="300" height="62" rx="6" fill="#0f6b3a" stroke="#f4f4f2" stroke-width="5"/>
      <text x="130" y="44" text-anchor="middle" fill="#f4f4f2" font-family="Overpass, Inter, Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="3">JEB ST</text>
    </g>
    <!-- JEV BENCHMARKS arrow sign (green) pointing down the road -->
    <g transform="translate(1031 236) rotate(3)">
      <path d="M-40 0 H250 L282 30 L250 60 H-40 Z" fill="#0f6b3a" stroke="#f4f4f2" stroke-width="5"/>
      <text x="112" y="40" text-anchor="middle" fill="#f4f4f2" font-family="Overpass, Inter, Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="2">JEV BENCHMARKS</text>
    </g>
    <!-- yellow diamond warning -->
    <g transform="translate(1031 372) rotate(-2)">
      <rect x="-52" y="-52" width="104" height="104" rx="10" transform="rotate(45)" fill="#f5c518" stroke="#111" stroke-width="5"/>
      <text x="0" y="-8" text-anchor="middle" fill="#111" font-family="Overpass, Inter, Arial, sans-serif" font-weight="900" font-size="16">DECISIONS</text>
      <text x="0" y="14" text-anchor="middle" fill="#111" font-family="Overpass, Inter, Arial, sans-serif" font-weight="900" font-size="16">AHEAD</text>
    </g>
  </g>
  <!-- a second, smaller post on the left: ONE PASS -->
  <g filter="url(#shadow)" transform="translate(90 214)">
    <rect x="0" y="0" width="8" height="90" fill="url(#pole)"/>
    <g transform="translate(4 -14) rotate(2)">
      <rect x="-70" y="-30" width="140" height="44" rx="5" fill="#f4f4f2" stroke="#111" stroke-width="4"/>
      <text x="0" y="6" text-anchor="middle" fill="#111" font-family="Overpass, Inter, Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="1">ONE PASS</text>
      <text x="0" y="-17" text-anchor="middle" fill="#e5484d" font-family="Overpass, Inter, Arial, sans-serif" font-weight="900" font-size="9" letter-spacing="2">SPEED LIMIT</text>
    </g>
  </g>
  <!-- horizon glow -->
  <ellipse cx="710" cy="300" rx="380" ry="26" fill="#ffd166" opacity=".35" filter="url(#glow)"/>
</svg>
